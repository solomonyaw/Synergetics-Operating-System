[workspace]

resolver = "2"

members = [

    "crates/sos-app",

    "crates/sos-core",

    "crates/sos-shell",

    "crates/sos-ui",

    "crates/sos-theme",

    "crates/sos-topology",

    "crates/sos-scheduler",

    "crates/sos-resource",

    "crates/sos-widgets",

    "crates/sos-services",

    "crates/sos-window",

    "crates/sos-filesystem",

    "crates/sos-ai",

    "crates/sos-utils"

]

default-members = [

    "crates/sos-app"

]

[workspace.package]

edition = "2024"

license = "SOSL-1.0"

authors = ["Solomon Yaw Adeklo"]

repository = "https://github.com/solomonyaw/Synergetics-Operating-System"

version = "0.1.0"

[workspace.dependencies]

eframe = "0.33"

egui = "0.33"

egui_dock = "0.18"

petgraph = "0.8"

egui_plot = "0.34"

serde = { version="1", features=["derive"] }

serde_json = "1"

tokio = { version="1", features=["full"] }

image = "0.25"

walkdir = "2"

chrono = "0.4"

tracing = "0.1"

tracing-subscriber = "0.3"

anyhow = "1"

thiserror = "2"

uuid = { version="1", features=["v4"] }

directories = "6"

once_cell = "1"

parking_lot = "0.12"

rayon = "1"
